
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
@import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');

:root {
  --primary: #004445;
  --primary-dark: #002d2e;
  --accent: #feb300;
  --accent-soft: #fff4d1;
  --bg: #f4f7f6;
  --surface: #ffffff;
  --ink: #2c3e50;
  --ink-soft: #7f8c8d;
  --line: #e0e6e8;
  --danger: #e74c3c;
  --success: #27ae60;
}

body {
  margin: 0;
  font-family: 'Sarabun', sans-serif;
  background-color: var(--bg);
  color: var(--ink);
}

#pos-root {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}

/* Sidebar Design */
.sidebar {
  background: var(--primary-dark);
  color: white;
  padding: 20px 0;
  display: flex;
  flex-direction: column;
  box-shadow: 4px 0 10px rgba(0,0,0,0.1);
}
.sidebar-header {
  padding: 0 25px 30px;
  text-align: center;
}
.sidebar-header h1 {
  font-family: 'Kanit', sans-serif;
  font-size: 22px;
  margin: 0;
  color: var(--accent);
}
.nav-menu {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.nav-item {
  padding: 14px 25px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 500;
  transition: 0.3s;
  color: rgba(255,255,255,0.7);
  border-left: 4px solid transparent;
}
.nav-item:hover {
  background: rgba(255,255,255,0.05);
  color: white;
}
.nav-item.active {
  background: rgba(254, 179, 0, 0.1);
  color: var(--accent);
  border-left-color: var(--accent);
}

/* Content Area */
.main-content {
  padding: 25px;
  overflow-y: auto;
  max-height: 100vh;
}

/* Product Cards */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
}
.card {
  background: var(--surface);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  transition: 0.3s;
  border: 1px solid var(--line);
  position: relative;
}
.card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
.card-img { width: 100%; height: 130px; object-fit: cover; background: #eee; }
.card-body { padding: 12px; }
.card-title { font-weight: 600; font-size: 15px; margin-bottom: 5px; color: var(--primary-dark); }
.card-price { font-weight: 700; color: var(--primary); font-family: 'IBM Plex Mono'; font-size: 16px; }

/* Cart Styling */
.cart-panel {
  background: white;
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  border: 1px solid var(--line);
}
.cart-header { padding: 20px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 18px; }
.cart-list { flex: 1; overflow-y: auto; padding: 15px; }
.cart-item {
  display: grid;
  grid-template-columns: 1fr 60px 40px;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid #f9f9f9;
}
.qty-input {
  width: 100%;
  padding: 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  text-align: center;
  font-weight: 700;
  background: var(--bg);
}

/* Utilities */
.btn-primary { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; }
.btn-primary:hover { background: var(--primary-dark); }
.badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
.badge-gold { background: var(--accent-soft); color: #8a6d3b; }

/* Print Layout */
@media print {
  #pos-root { display: none; }
  #print-area { display: flex; flex-wrap: wrap; gap: 5px; }
  .price-tag {
    width: 45mm; height: 30mm; border: 0.5px solid #000;
    padding: 2mm; display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-sizing: border-box; text-align: center;
  }
  .tag-name { font-size: 10pt; font-weight: bold; margin-bottom: 2px; height: 2.4em; overflow: hidden; }
  .tag-price { font-size: 15pt; font-weight: 900; margin-bottom: 2px; }
  .tag-bc { height: 10mm; width: 100%; }
}
</style>

</div>

<div id="print-area"></div>

<script>
(function(){

    return isMember ? (p.priceRetailMember || 0) : (p.priceRetailGeneral || 0);

    el.innerHTML = `

        <div>
          <div style="display: flex; gap: 15px; margin-bottom: 20px;">
            <div style="position:relative; flex:1;">
              <i class="fa-solid fa-search" style="position:absolute; left:15px; top:15px; color:#ccc;"></i>

            </div>
            <select id="mem-sel" style="padding:10px; border-radius:15px; border:1px solid var(--line); width:180px;">
              <option value="">-- ลูกค้าทั่วไป --</option>
              ${members.map(m => `<option value="${m.id}" ${selectedMemberId===m.id?'selected':''}>${m.name}</option>`).join('')}
            </select>
          </div>
          
          <div style="display:flex; gap:10px; overflow-x:auto; padding-bottom:15px; margin-bottom:15px;">
             ${['ทั้งหมด', ...categories].map(c => `<button onclick="setCat('${c}')" style="padding:8px 18px; border-radius:20px; border:none; background:${activeCat===c?'var(--primary)':'white'}; color:${activeCat===c?'white':'var(--ink)'}; cursor:pointer; white-space:nowrap; box-shadow:0 2px 5px rgba(0,0,0,0.05); font-weight:600;">${c}</button>`).join('')}
          </div>

          <div class="product-grid">

                <div class="card-body">
                  <div class="card-title">${p.name}</div>
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="card-price">฿${getPrice(p).toLocaleString()}</span>

          <div class="cart-header">ตะกร้าสินค้า ${selectedMemberId ? '<span class="badge badge-gold">สมาชิก</span>' : ''}</div>

                  <div style="font-size:12px; color:var(--primary);">฿${item.price.toLocaleString()}</div>
                </div>
                <input type="number" class="qty-input" value="${item.qty}" onchange="updateQty('${item.id}', this.value)">
                <button onclick="rmCart('${item.id}')" style="color:var(--danger); border:none; background:none; cursor:pointer;"><i class="fa-solid fa-trash-can"></i></button>
              </div>
            `).join(cart.length ? '' : '<div style="text-align:center; padding:50px; color:#ccc;"><i class="fa-solid fa-basket-shopping fa-3x"></i><p>แตะสินค้าเพื่อเริ่มการขาย</p></div>')}
          </div>
          <div style="padding:20px; background:#fcfcfc; border-top:1px solid var(--line); border-radius:0 0 20px 20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:18px; font-weight:800;">
              <span>ยอดรวม</span>
              <span style="color:var(--primary);">฿${cart.reduce((s,i)=>s+(i.price*i.qty),0).toLocaleString()}</span>
            </div>
            <button class="btn-primary" onclick="checkout()">ชำระเงิน (F10)</button>
          </div>
        </div>
      </div>
    `;
    
    const sin = document.getElementById('search-in');
    sin.focus(); sin.oninput = (e) => { searchQ = e.target.value; render(); sin.focus(); };
    document.getElementById('mem-sel').onchange = (e) => { 
      selectedMemberId = e.target.value; 
      // อัปเดตราคาทั้งตะกร้าตามสมาชิกที่เลือก
      cart = cart.map(i => {
        const p = products.find(x => x.id === i.id);
        return p ? {...i, price: getPrice(p)} : i;
      });
      render(); 
    };
  }

          <button type="submit" class="btn-primary">บันทึกสินค้า</button>
        </form>

            <th>สต็อก</th>
            <th>การจัดการ</th>
          </tr>
        </thead>
        <tbody>

              <td style="padding:12px; display:flex; align-items:center; gap:12px;">

                <div>
                  <div style="font-weight:600;">${p.name}</div>
                  <div style="font-size:11px; color:#aaa;">${p.barcode||'ไม่มีบาร์โค้ด'}</div>
                </div>
              </td>
              <td align="center">${p.category}</td>
              <td align="center">฿${(p.priceRetailGeneral||0).toLocaleString()}</td>
              <td align="center"><span class="badge ${p.stock<=5?'badge-danger':'badge-gold'}" style="background:${p.stock<=5?'#ffdce0':'#e3fcef'}; color:${p.stock<=5?'#e74c3c':'#27ae60'};">${p.stock} ${p.unit||''}</span></td>
              <td align="center">
                <button onclick="delP('${p.id}')" style="color:var(--danger); border:none; background:none; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;

      e.preventDefault();
      const fd = new FormData(e.target);
      const np = {
        id: 'p-' + Date.now(),
        name: fd.get('name'),
        category: fd.get('category'),
        barcode: fd.get('barcode'),
        stock: parseFloat(fd.get('stock')) || 0,
        unit: fd.get('unit'),
        img: fd.get('img'),
