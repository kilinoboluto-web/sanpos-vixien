<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SAN POS ULTIMATE</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@400;500;600&family=Noto+Sans+Lao:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

        :root {
            --primary: #1F5F4A;
            --primary-dark: #143C30;
            --gold: #E8A33D;
            --surface: #FFFFFF;
            --bg: #F2F4EE;
            --ink: #1C2320;
            --line: #DDE3D9;
            --danger: #C1502E;
        }

        body {
            margin: 0;
            font-family: 'Sarabun', 'Noto Sans Lao', sans-serif;
            background: var(--bg);
            color: var(--ink);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header & Tabs */
        .header {
            background: var(--primary-dark);
            color: white;
            padding: 10px 15px;
            flex-shrink: 0;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .tabs {
            display: flex; gap: 5px; overflow-x: auto;
            padding: 10px 0 5px; border-top: 1px solid rgba(255,255,255,0.1);
        }
        .tab-btn {
            background: rgba(255,255,255,0.1); color: white; border: none;
            padding: 8px 15px; border-radius: 8px; white-space: nowrap; cursor: pointer;
            font-size: 13px; font-weight: 500;
        }
        .tab-btn.active { background: var(--gold); color: var(--primary-dark); font-weight: 700; }

        /* Main Body Layout */
        .main-container {
            flex-grow: 1;
            display: flex;
            overflow: hidden;
            height: 100%;
        }

        /* Sell Screen Layout */
        .sell-grid {
            display: grid;
            grid-template-columns: 1fr 350px;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 900px) {
            .sell-grid { grid-template-columns: 1fr; grid-template-rows: 1fr 200px; }
            .cart-panel { border-left: none !important; border-top: 2px solid var(--line); }
        }

        .product-area {
            padding: 15px;
            overflow-y: auto;
            background: var(--bg);
        }

        .cart-panel {
            background: white;
            display: flex;
            flex-direction: column;
            border-left: 2px solid var(--line);
        }

        /* Product Cards */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }
        .p-card {
            background: white; border: 1px solid var(--line); border-radius: 12px;
            overflow: hidden; transition: 0.2s; cursor: pointer;
        }
        .p-card:hover { transform: translateY(-3px); border-color: var(--primary); }
        .p-img { width: 100%; height: 100px; object-fit: cover; background: #eee; }
        .p-info { padding: 8px; }
        .p-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; height: 1.4em; overflow: hidden; }
        .p-price { color: var(--primary); font-weight: 700; font-size: 15px; }

        /* Cart Styling */
        .cart-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .cart-item {
            display: grid; grid-template-columns: 1fr 60px 30px;
            gap: 10px; align-items: center; padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0; margin-bottom: 10px;
        }
        .qty-input { width: 100%; padding: 5px; text-align: center; border-radius: 5px; border: 1px solid var(--line); font-weight: 700; }
        
        .cart-summary {
            padding: 15px; background: #f9f9f9; border-top: 1px solid var(--line);
        }

        /* Modal / QR Overlay */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 20px;
            width: 90%; max-width: 400px; text-align: center;
        }
        .qr-display { width: 200px; height: 200px; margin: 10px auto; border: 5px solid #eee; }
        .qr-display img { width: 100%; height: 100%; object-fit: contain; }

        /* Stock Table */
        .data-table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; }
        .data-table th, .data-table td { padding: 12px; border-bottom: 1px solid var(--line); text-align: left; }

        /* Print Style */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; display: flex; flex-wrap: wrap; gap: 5px; }
            .price-tag { 
                width: 45mm; height: 28mm; border: 0.5px solid #000; 
                display: flex; flex-direction: column; align-items: center; justify-content: center;
                text-align: center; padding: 1mm;
            }
            .tag-bc { height: 10mm; width: 90%; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-top">
        <h2 style="margin:0; font-family:'Kanit'; color:var(--gold);">SAN POS PRO</h2>
        <div id="lang-switch">
            <button class="tab-btn" onclick="setLang('th')">TH</button>
            <button class="tab-btn" onclick="setLang('lo')">LO</button>
            <button class="tab-btn" onclick="setLang('en')">EN</button>
        </div>
    </div>
    <div class="tabs">
        <button class="tab-btn active" id="btn-sell" onclick="setTab('sell')"><i class="fa fa-cart-shopping"></i> ขาย</button>
        <button class="tab-btn" id="btn-stock" onclick="setTab('stock')"><i class="fa fa-boxes"></i> สต็อก/ป้าย</button>
        <button class="tab-btn" id="btn-members" onclick="setTab('members')"><i class="fa fa-users"></i> สมาชิก</button>
        <button class="tab-btn" id="btn-reports" onclick="setTab('reports')"><i class="fa fa-chart-line"></i> รายงาน/QR</button>
    </div>
</div>

<div class="main-container" id="main-view"></div>

<!-- พื้นที่พิมพ์ -->
<div id="print-area"></div>

<script>
    // --- Data Storage ---
    let products = JSON.parse(localStorage.getItem('pos-products-v2') || '[]');
    let members = JSON.parse(localStorage.getItem('pos-members-v2') || '[]');
    let sales = JSON.parse(localStorage.getItem('pos-sales-v2') || '[]');
    let categories = JSON.parse(localStorage.getItem('pos-categories-v2') || ['ทั่วไป']);
    let shopQr = localStorage.getItem('pos-shop-qr') || '';
    
    let currentTab = 'sell';
    let currentLang = 'th';
    let cart = [];
    let selectedMemberId = '';
    let searchQuery = '';
    let tagQueue = [];

    const i18n = {
        th: { total: 'ยอดรวม', pay: 'ชำระเงิน', change: 'เงินทอน', stock: 'คงเหลือ', search: 'ค้นหา/บาร์โค้ด...', checkout: 'สำเร็จ', transfer: 'โอนเงิน', uploadQr: 'อัปโหลด QR ร้าน' },
        lo: { total: 'ລວມທັງໝົດ', pay: 'ຊຳລະເງິນ', change: 'ເງິນທອນ', stock: 'ຄົງເຫຼືອ', search: 'ຄົ້ນຫາ...', checkout: 'ສຳເລັດ', transfer: 'ໂອນເງິນ', uploadQr: 'ອັບໂຫລດ QR' },
        en: { total: 'Total', pay: 'Pay', change: 'Change', stock: 'Stock', search: 'Search...', checkout: 'Checkout', transfer: 'Transfer', uploadQr: 'Upload QR' }
    };

    function t(key) { return i18n[currentLang][key] || key; }

    function save() {
        localStorage.setItem('pos-products-v2', JSON.stringify(products));
        localStorage.setItem('pos-members-v2', JSON.stringify(members));
        localStorage.setItem('pos-sales-v2', JSON.stringify(sales));
        localStorage.setItem('pos-shop-qr', shopQr);
    }

    function setTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + tab).classList.add('active');
        render();
    }

    function setLang(l) { currentLang = l; render(); }

    function getPrice(p) {
        const isMem = !!selectedMemberId;
        return isMem ? (p.priceRetailMember || 0) : (p.priceRetailGeneral || 0);
    }

    // --- Core UI Renderers ---

    function render() {
        const view = document.getElementById('main-view');
        if (currentTab === 'sell') renderSell(view);
        else if (currentTab === 'stock') renderStock(view);
        else if (currentTab === 'members') renderMembers(view);
        else if (currentTab === 'reports') renderReports(view);
    }

    function renderSell(el) {
        let filtered = products.filter(p => p.name.includes(searchQuery) || (p.barcode && p.barcode === searchQuery));
        
        el.innerHTML = `
            <div class="sell-grid">
                <div class="product-area">
                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                        <input type="text" id="sell-search" placeholder="${t('search')}" value="${searchQuery}" style="flex:1; padding:12px; border-radius:10px; border:1px solid var(--line);">
                        <select id="sel-member" onchange="setMember(this.value)" style="padding:10px; border-radius:10px;">
                            <option value="">-- ${t('search')} --</option>
                            ${members.map(m => `<option value="${m.id}" ${selectedMemberId===m.id?'selected':''}>${m.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="product-grid">
                        ${filtered.map(p => `
                            <div class="p-card" onclick="addToCart('${p.id}')">
                                <img src="${p.img || 'https://via.placeholder.com/150?text=No+Image'}" class="p-img">
                                <div class="p-info">
                                    <div class="p-name">${p.name}</div>
                                    <div class="p-price">฿${getPrice(p).toLocaleString()}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="cart-panel">
                    <div style="padding:15px; font-weight:bold; border-bottom:1px solid var(--line);">ตะกร้าสินค้า</div>
                    <div class="cart-list">
                        ${cart.map(item => `
                            <div class="cart-item">
                                <div><div style="font-size:14px;">${item.name}</div><div style="font-size:12px; color:var(--primary);">฿${item.price}</div></div>
                                <input type="number" class="qty-input" value="${item.qty}" onchange="updateQty('${item.id}', this.value)">
                                <button onclick="rmCart('${item.id}')" style="border:none; background:none; color:red;">✕</button>
                            </div>
                        `).join('')}
                    </div>
                    <div class="cart-summary">
                        <div style="display:flex; justify-content:space-between; font-size:20px; font-weight:bold; margin-bottom:15px;">
                            <span>${t('total')}</span>
                            <span style="color:var(--primary);">฿${cart.reduce((s,i)=>s+(i.price*i.qty),0).toLocaleString()}</span>
                        </div>
                        <button onclick="showPayModal()" style="width:100%; padding:15px; border-radius:10px; border:none; background:var(--primary); color:white; font-weight:bold; font-size:18px;">${t('pay')}</button>
                    </div>
                </div>
            </div>
        `;
        const input = document.getElementById('sell-search');
        input.focus();
        input.oninput = (e) => { searchQuery = e.target.value; render(); input.focus(); };
    }

    function renderStock(el) {
        el.innerHTML = `
            <div style="padding:20px; overflow-y:auto; width:100%;">
                <div style="background:white; padding:20px; border-radius:15px; margin-bottom:20px;">
                    <h3>เพิ่ม/แก้ไขสินค้า</h3>
                    <form id="prod-form" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:10px;">
                        <input type="text" name="name" placeholder="ชื่อสินค้า *" required style="padding:8px;">
                        <input type="text" name="barcode" placeholder="บาร์โค้ด">
                        <input type="text" name="img" placeholder="URL รูปภาพ (Google)">
                        <input type="number" name="prG" placeholder="ราคาปลีกทั่วไป">
                        <input type="number" name="prM" placeholder="ราคาปลีกสมาชิก">
                        <input type="number" name="stock" placeholder="สต็อก">
                        <button type="submit" style="background:var(--primary); color:white; border:none; border-radius:5px;">บันทึก</button>
                    </form>
                </div>
                <button onclick="printBatchTags()" style="margin-bottom:10px; padding:10px; background:var(--gold); border:none; border-radius:5px;">พิมพ์ป้ายที่เลือก (${tagQueue.length})</button>
                <table class="data-table">
                    <thead><tr><th>เลือก</th><th>สินค้า</th><th>บาร์โค้ด</th><th>ราคา</th><th>สต็อก</th><th>จัดการ</th></tr></thead>
                    <tbody>
                        ${products.map(p => `
                            <tr>
                                <td><input type="checkbox" onchange="toggleTagQueue('${p.id}')" ${tagQueue.includes(p.id)?'checked':''}></td>
                                <td>${p.name}</td>
                                <td>${p.barcode || '-'}</td>
                                <td>${p.priceRetailGeneral || 0}</td>
                                <td>${p.stock || 0}</td>
                                <td><button onclick="delProduct('${p.id}')" style="color:red; background:none; border:none;">ลบ</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
        document.getElementById('prod-form').onsubmit = (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            products.push({
                id: 'p-' + Date.now(),
                name: fd.get('name'),
                barcode: fd.get('barcode'),
                img: fd.get('img'),
                priceRetailGeneral: parseFloat(fd.get('prG')) || 0,
                priceRetailMember: parseFloat(fd.get('prM')) || 0,
                stock: parseFloat(fd.get('stock')) || 0
            });
            save(); render();
        };
    }

    function renderReports(el) {
        el.innerHTML = `
            <div style="padding:20px; width:100%;">
                <div style="background:white; padding:20px; border-radius:15px; margin-bottom:20px; border:2px solid var(--gold);">
                    <h3><i class="fa fa-qrcode"></i> ตั้งค่า QR Code ร้านค้า (โอนเงิน)</h3>
                    <p style="font-size:12px; color:var(--ink-soft);">อัปโหลด QR Code ของคุณที่นี่ รูปจะถูกบันทึกไว้ใช้ถาวร</p>
                    <input type="file" accept="image/*" onchange="handleQrUpload(this)" style="margin-bottom:10px;">
                    <div style="width:150px; height:150px; background:#f0f0f0; border:2px dashed #ccc;">
                        ${shopQr ? `<img src="${shopQr}" style="width:100%; height:100%; object-fit:contain;">` : '<div style="padding:40px 10px; font-size:10px;">ยังไม่มี QR</div>'}
                    </div>
                </div>
                <h3>รายการขายล่าสุด</h3>
                <div style="background:white; border-radius:15px; overflow:hidden;">
                    <table class="data-table">
                        ${sales.slice().reverse().slice(0, 10).map(s => `
                            <tr><td>${new Date(s.ts).toLocaleString()}</td><td>฿${s.total.toLocaleString()}</td></tr>
                        `).join('')}
                    </table>
                </div>
            </div>
        `;
    }

    function renderMembers(el) {
        el.innerHTML = `
            <div style="padding:20px; width:100%;">
                <div style="background:white; padding:20px; border-radius:15px; margin-bottom:20px;">
                    <h3>เพิ่มสมาชิก</h3>
                    <form id="mem-form" style="display:flex; gap:10px;">
                        <input type="text" name="name" placeholder="ชื่อสมาชิก" required style="flex:1; padding:8px;">
                        <input type="text" name="phone" placeholder="เบอร์โทร" style="padding:8px;">
                        <button type="submit" style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:5px;">เพิ่ม</button>
                    </form>
                </div>
                <table class="data-table">
                    ${members.map(m => `<tr><td>${m.name}</td><td>${m.phone}</td><td><button onclick="delMember('${m.id}')">ลบ</button></td></tr>`).join('')}
                </table>
            </div>
        `;
        document.getElementById('mem-form').onsubmit = (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            members.push({ id: 'm-' + Date.now(), name: fd.get('name'), phone: fd.get('phone') });
            save(); render();
        };
    }

    // --- Functions ---
    window.addToCart = (id) => {
        const p = products.find(x => x.id === id);
        const has = cart.find(x => x.id === id);
        if(has) has.qty++;
        else cart.push({ id: p.id, name: p.name, price: getPrice(p), qty: 1 });
        render();
    };
    window.updateQty = (id, v) => {
        const item = cart.find(x => x.id === id);
        if(item) { item.qty = parseFloat(v) || 1; render(); }
    };
    window.rmCart = (id) => { cart = cart.filter(x => x.id !== id); render(); };
    window.setMember = (id) => {
        selectedMemberId = id;
        cart = cart.map(item => {
            const p = products.find(x => x.id === item.id);
            return p ? { ...item, price: getPrice(p) } : item;
        });
        render();
    };

    window.handleQrUpload = (input) => {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            shopQr = e.target.result;
            save(); render();
        };
        reader.readAsDataURL(file);
    };

    window.showPayModal = () => {
        if(!cart.length) return;
        const total = cart.reduce((s,i)=>s+(i.price*i.qty),0);
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h2>ยอดชำระ: ฿${total.toLocaleString()}</h2>
                ${shopQr ? `
                    <p style="color:var(--primary); font-weight:bold;">${t('transfer')}</p>
                    <div class="qr-display"><img src="${shopQr}"></div>
                ` : '<p style="font-size:12px; color:red;">* ยังไม่ได้ตั้งค่า QR ร้านค้า</p>'}
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button onclick="this.parentElement.parentElement.parentElement.remove()" style="flex:1; padding:10px; border:none; background:#eee; border-radius:10px;">ยกเลิก</button>
                    <button onclick="completeSale()" style="flex:2; padding:10px; border:none; background:var(--primary); color:white; border-radius:10px; font-weight:bold;">${t('checkout')}</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    };

    window.completeSale = () => {
        const total = cart.reduce((s,i)=>s+(i.price*i.qty),0);
        sales.push({ ts: new Date().toISOString(), total, items: [...cart], memberId: selectedMemberId });
        cart.forEach(c => {
            const p = products.find(x => x.id === c.id);
            if(p) p.stock -= c.qty;
        });
        cart = []; selectedMemberId = ''; 
        save();
        document.querySelectorAll('.modal').forEach(m => m.remove());
        render();
    };

    window.toggleTagQueue = (id) => {
        if(tagQueue.includes(id)) tagQueue = tagQueue.filter(x => x !== id);
        else tagQueue.push(id);
    };

    window.printBatchTags = () => {
        if(!tagQueue.length) return alert('กรุณาเลือกสินค้า');
        const area = document.getElementById('print-area');
        area.innerHTML = tagQueue.map(id => {
            const p = products.find(x => x.id === id);
            return `
                <div class="price-tag">
                    <div style="font-size:10px; font-weight:bold;">${p.name}</div>
                    <div style="font-size:18px; font-weight:900;">฿${(p.priceRetailGeneral||0).toLocaleString()}</div>
                    <svg class="tag-bc" id="bc-${p.id}"></svg>
                </div>
            `;
        }).join('');
        tagQueue.forEach(id => {
            const p = products.find(x => x.id === id);
            if(p.barcode) JsBarcode("#bc-"+p.id, p.barcode, { height: 30, displayValue: true, fontSize: 10 });
        });
        setTimeout(() => { window.print(); tagQueue = []; render(); }, 500);
    };

    window.delProduct = (id) => { if(confirm('ลบ?')) { products = products.filter(x => x.id !== id); save(); render(); } };
    window.delMember = (id) => { if(confirm('ลบ?')) { members = members.filter(x => x.id !== id); save(); render(); } };

    // Start App
    render();
</script>

</body>
</html>
