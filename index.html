    // กรองรายการคลังสินค้าตามคำค้นหา + หมวดหมู่ที่เลือก
    getFilteredStockProducts() {
        const q = (this.state.stockSearch || '').trim().toLowerCase();
        const cat = this.state.stockCat || 'ทั้งหมด';
        return this.db.products.filter(p => {
            const matchQ = !q || p.name.toLowerCase().includes(q) || (p.bc||'').toString().toLowerCase().includes(q);
            const matchCat = cat === 'ทั้งหมด' || (p.category || 'ทั่วไป') === cat;
            return matchQ && matchCat;
        });
    },

    renderStockListItems() {
        const list = this.getFilteredStockProducts();
        return list.map(p => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #eee">
                <div style="display:flex; align-items:center; gap:10px; flex:1; cursor:${this.state.labelMode ? 'default' : 'pointer'};" ${this.state.labelMode ? '' : `onclick="App.openQuickEdit('${p.id}')"`}>
                    ${this.state.labelMode ? `<input type="checkbox" ${this.state.labelSelected.includes(p.id)?'checked':''} onchange="App.toggleLabelSelect('${p.id}')" style="width:20px; height:20px; flex-shrink:0;">` : ''}
                    <img src="${p.img || 'https://via.placeholder.com/40'}" style="width:40px; height:40px; border-radius:8px; object-fit:cover; flex-shrink:0;">
                    <div>
                        <b>${p.name}</b> <small style="color:var(--ink-s);">(${p.category||'ทั่วไป'})</small><br>
                        <small class="mono">฿${p.pr1} | รหัส: ${p.bc||'-'} | คงเหลือ: ${p.stock}</small>
                    </div>
                </div>
                <div style="display:flex; gap:6px; flex-shrink:0;">
                    ${this.state.labelMode ? '' : `
                        <button onclick="event.stopPropagation(); App.editP('${p.id}')" style="color:var(--p); border:none; background:none; cursor:pointer; font-size:16px;" title="แก้ไขข้อมูลทั้งหมด">✏️</button>
                        <button onclick="event.stopPropagation(); App.deleteP('${p.id}')" style="color:var(--err); border:none; background:none; cursor:pointer; font-size:16px;" title="ลบสินค้า">🗑️</button>
                    `}
                </div>
            </div>
        `).join('') || '<div style="text-align:center; padding:10px;">ไม่พบสินค้าที่ค้นหา</div>';
    },

    filterStockList() {
        const input = document.getElementById('stock_search');
        this.state.stockSearch = input ? input.value : '';
        const list = document.getElementById('stock-list');
        if(list) list.innerHTML = this.renderStockListItems();
    },

    filterStockCat(cat) {
        this.state.stockCat = cat;
        document.querySelectorAll('#stock-cat-bar .cat-btn').forEach(b => b.classList.toggle('active', b.innerText === cat));
        const list = document.getElementById('stock-list');
        if(list) list.innerHTML = this.renderStockListItems();
    },

    // --- แก้ไขราคา/สต๊อกแบบเร็ว (popup) — ใช้ได้ทั้งจากหน้าสต๊อก และจากตะกร้าในหน้าขายสินค้า (fromCart=true) ---
    openQuickEdit(id, fromCart) {
        if(!this.isAdmin()) { this.requireAdmin(() => this.openQuickEdit(id, fromCart)); return; }
        const p = this.db.products.find(x => x.id === id);
        if(!p) { alert("⚠️ ไม่พบข้อมูลสินค้านี้ (id: " + id + ") กรุณาลองรีเฟรชหน้าเว็บแล้วลองใหม่"); return; }
        this._quickEditFromCart = !!fromCart;
        this.openM(`
            <h3 style="margin-top:0">✏️ แก้ไขด่วน: ${p.name}</h3>
            ${fromCart ? '<p style="font-size:11px; color:var(--ink-s); margin-top:-6px;">แก้ไขแล้วราคาสินค้านี้ในตะกร้าจะอัปเดตให้อัตโนมัติ</p>' : ''}
            <label style="font-size:11px; font-weight:600; color:var(--ink-s); display:block; margin-bottom:4px;">หมวดหมู่</label>
            <select id="qe_cat" class="input-main">
                ${this.db.categories.map(c=>`<option value="${c}" ${((p.category||'ทั่วไป')===c)?'selected':''}>${c}</option>`).join('')}
            </select>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div>
                    <label style="font-size:11px; font-weight:600; color:var(--ink-s); display:block; margin-bottom:4px;">ต้นทุน (บาท)</label>
                    <input type="number" id="qe_cost" class="input-main" style="margin-bottom:0" value="${p.cost||0}" step="0.01">
                </div>
                <div>
                    <label style="font-size:11px; font-weight:600; color:var(--ink-s); display:block; margin-bottom:4px;">จำนวนสต๊อก</label>
                    <input type="number" id="qe_stock" class="input-main" style="margin-bottom:0" value="${p.stock||0}">
                </div>
                <div>
                    <label style="font-size:11px; font-weight:600; color:var(--ink-s); display:block; margin-bottom:4px;">ราคาขายปลีก</label>
                    <input type="number" id="qe_pr1" class="input-main" style="margin-bottom:0" value="${p.pr1||0}">
                </div>
                <div>
                    <label style="font-size:11px; font-weight:600; color:var(--ink-s); display:block; margin-bottom:4px;">ราคาขายส่ง</label>
                    <input type="number" id="qe_pw1" class="input-main" style="margin-bottom:0" value="${p.pw1||0}">
                </div>
            </div>
            <button class="btn btn-p" style="width:100%; margin-top:14px;" onclick="App.saveQuickEdit('${p.id}')">💾 บันทึก</button>
            ${fromCart ? `<button class="btn btn-outline" style="width:100%; margin-top:8px;" onclick="App.modalCart()">ยกเลิก (กลับไปตะกร้า)</button>`
                       : `<button class="btn btn-outline" style="width:100%; margin-top:8px;" onclick="App.closeM(); App.editP('${p.id}')">แก้ไขข้อมูลอื่น (ชื่อ/รูป/บาร์โค้ด) →</button>
            <button class="btn btn-outline" style="width:100%; margin-top:8px;" onclick="App.closeM()">ยกเลิก</button>`}
        `);
    },

    saveQuickEdit(id) {
        const idx = this.db.products.findIndex(x => x.id === id);
        if(idx === -1) return;
        const cat = document.getElementById('qe_cat').value;
        const cost = parseFloat(document.getElementById('qe_cost').value) || 0;
        const stock = parseInt(document.getElementById('qe_stock').value) || 0;
        const pr1 = parseFloat(document.getElementById('qe_pr1').value) || 0;
        const pw1 = parseFloat(document.getElementById('qe_pw1').value) || 0;
        this.db.products[idx] = { ...this.db.products[idx], category: cat, cost, stock, pr1, pw1 };
        this.save();
        if(this._quickEditFromCart) {
            this._quickEditFromCart = false;
            this.recalcCartPrices();
            this.modalCart();
        } else {
            this.closeM();
            this.render();
        }
        alert("✅ อัปเดตราคา/สต๊อกเรียบร้อยแล้ว");
    },

    // --- แก้ไขชื่อหมวดหมู่เดิม (เปลี่ยนชื่อในสินค้าทุกตัวที่อยู่หมวดนั้นด้วย) ---
    startRenameCategory(idx) {
        if(!this.isAdmin()) { this.requireAdmin(() => this.startRenameCategory(idx)); return; }
        const chip = document.querySelectorAll('#cat-chip-list .cat-chip')[idx];
        if(!chip) return;
        const textEl = chip.querySelector('.cat-chip-text');
        const oldName = this.db.categories[idx];
        if(chip.querySelector('input')) return;

        const input = document.createElement('input');
        input.type = 'text';
        input.value = oldName;
        input.className = 'input-main';
        input.style.cssText = 'margin-bottom:0; width:110px; padding:4px 8px; font-size:12px; border-radius:8px;';
        input.onkeydown = (e) => { if(e.key==='Enter'){ e.preventDefault(); App.confirmRenameCategory(idx, input.value); } };
        textEl.replaceWith(input);
        input.focus();
        input.select();

        const editIcon = chip.children[1];
        editIcon.textContent = '✓';
        editIcon.style.color = 'var(--ok)';
        editIcon.onclick = () => this.confirmRenameCategory(idx, input.value);
    },

    confirmRenameCategory(idx, newNameRaw) {
        const newName = (newNameRaw || '').trim();
        const oldName = this.db.categories[idx];
        if(!newName || newName === oldName) { this.render(); return; }
        if(this.db.categories.includes(newName)) {
            alert("⚠️ มีหมวดหมู่นี้ในระบบแล้ว");
            this.render();
            return;
        }
        this.db.categories[idx] = newName;
        this.db.products.forEach(p => {
            if((p.category || 'ทั่วไป') === oldName) p.category = newName;
        });
        this.save();
        this.render();

    payBillDebt(sid) {
        const s = this.db.sales.find(x => x.id === sid);
        if(!s) return;
        const m = this.db.members.find(x => x.id === s.memberId);
        const amt = prompt(`ยอดค้างชำระ ฿${s.debtRemaining} ชำระกี่บาท?`, s.debtRemaining);
        if(amt && parseFloat(amt) > 0) {
            const pay = parseFloat(amt);
            s.debtRemaining -= pay;
            if(m) m.debt = Math.max(0, (m.debt || 0) - pay);
            if(s.debtRemaining <= 0) s.status = 'paid';
            this.save(); this.render();
            alert("✅ บันทึกการชำระหนี้สำเร็จ");

    async printLabels() {

        if(typeof JsBarcode === 'undefined') {

                return;
            }
        }

        const printArea = document.getElementById('receipt-print');
        if(!printArea) return;

        printArea.innerHTML = `
            <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:0;">
                ${products.map((p, idx) => `
                    <div style="border:1px dashed #999; padding:8px 4px; text-align:center; page-break-inside:avoid;">
                        <div style="font-size:11px; font-weight:700; height:28px; overflow:hidden; line-height:14px;">${p.name}</div>
                        <div style="font-size:18px; font-weight:900; margin:4px 0;">฿${p.pr1}</div>
                        <svg id="lbl-bc-${idx}"></svg>
                    </div>
                `).join('')}
            </div>
        `;
        printArea.classList.remove('hidden');

        setTimeout(() => {
            products.forEach((p, idx) => {
                const el = document.getElementById('lbl-bc-' + idx);
                if(!el || typeof JsBarcode === 'undefined') return;
                const code = (p.bc && p.bc.trim()) ? p.bc.trim() : p.id;
                try {
                    JsBarcode(el, code, { format: "CODE128", displayValue: true, fontSize: 10, height: 35, width: 1.3, margin: 2 });
                } catch(e) {
                    try { JsBarcode(el, p.id, { format: "CODE128", displayValue: true, fontSize: 10, height: 35, width: 1.3, margin: 2 }); } catch(e2) {}
                }
            });
            document.body.classList.remove('paper-58mm', 'paper-80mm', 'paper-a4');

            pageStyle.textContent = '@page { size: A4; margin: 10mm; }';
            window.print();
            printArea.classList.add('hidden');
            printArea.innerHTML = '';

    // --- ดึงข้อมูลสินค้าจาก Cloud Barcode API ---
    async autoFetchProductInfo(bc) {
        bc = (bc || '').toString().trim();
        if (!bc) return;

        const nameInput = document.getElementById('pn');
        if (nameInput) nameInput.placeholder = "🔍 กำลังค้นหาข้อมูลจากบาร์โค้ด...";

        try {
            const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${bc}.json`);
            const data = await res.json();

            if (data && data.status === 1 && data.product) {
                const p = data.product;
                const productName = p.product_name_th || p.product_name || p.product_name_en || '';
                const imgUrl = p.image_front_small_url || p.image_url || '';

                if (productName && nameInput) {
                    nameInput.value = productName;
                }
                if (imgUrl) {
                    const imgDataInput = document.getElementById('pimg_data');
                    const imgPreview = document.getElementById('img-preview');
                    if (imgDataInput) imgDataInput.value = imgUrl;
                    if (imgPreview) imgPreview.innerHTML = `<img src="${imgUrl}" style="height:70px; border-radius:8px; border:2px solid var(--p);">`;
                }
                alert(`✅ เจอข้อมูลสินค้า: "${productName}"`);
            } else {
                console.log("ไม่พบข้อมูลสินค้านี้ในฐานข้อมูลกลาง");
            }
        } catch (err) {
            console.error("API Fetch Error:", err);
        } finally {
            if (nameInput) nameInput.placeholder = "ชื่อสินค้า";
        }
    },

    // --- พิมพ์ด้วยเสียง (Speech-to-Text) ---
    listenVoice(targetId) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("❌ เบราว์เซอร์นี้ไม่รองรับการพิมพ์ด้วยเสียง (แนะนำให้ใช้ Google Chrome หรือ Safari)");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'th-TH'; 
        recognition.interimResults = false;

        const targetInput = document.getElementById(targetId);
        if (targetInput) {
            targetInput.placeholder = "🎙️ กำลังฟังเสียง... พูดได้เลย";
            targetInput.style.borderColor = "var(--a)";
        }

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            if (targetInput) {
                targetInput.value = transcript;
                targetInput.placeholder = "ชื่อสินค้า";
                targetInput.style.borderColor = "var(--line)";
            }
        };

        recognition.onerror = () => {
            alert("⚠️ ไม่สามารถรับเสียงได้ กรุณาลองใหม่อีกครั้ง");
            if (targetInput) {
                targetInput.placeholder = "ชื่อสินค้า";
                targetInput.style.borderColor = "var(--line)";
            }
        };

        recognition.start();
    },

    // ประมวลผลรูปภาพ (ครอปกึ่งกลางให้เป็นสี่เหลี่ยมจัตุรัส + ย่อขนาด + บีบอัด) จาก File หรือ Blob แล้วคืนค่าเป็น base64
    // ครอปเป็นสี่เหลี่ยมจัตุรัสตั้งแต่ตอนบันทึก เพื่อให้รูปแสดงเต็มพอดีช่องในหน้าขายสินค้าเสมอ ไม่ว่าไฟล์ต้นฉบับจะเป็นแนวตั้ง แนวนอน หรือสี่เหลี่ยม
    processImageToBase64(fileOrBlob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const outSize = 300; // ขนาดรูปสี่เหลี่ยมจัตุรัสที่จะบันทึก
                    const srcSize = Math.min(img.width, img.height); // ด้านสั้นสุดของภาพต้นฉบับ
                    const srcX = (img.width - srcSize) / 2;   // ครอปจากกึ่งกลางแนวนอน
                    const srcY = (img.height - srcSize) / 2;  // ครอปจากกึ่งกลางแนวตั้ง

                    const canvas = document.createElement('canvas');
                    canvas.width = outSize;
                    canvas.height = outSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, srcX, srcY, srcSize, srcSize, 0, 0, outSize, outSize);
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.onerror = reject;
                img.src = event.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(fileOrBlob);
        });
    },

    handleImgUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        this.processImageToBase64(file).then(base64 => {
            const imgDataInput = document.getElementById('pimg_data');
            const preview = document.getElementById('img-preview');
            if(imgDataInput) imgDataInput.value = base64;
            if(preview) preview.innerHTML = `<img src="${base64}" style="height:70px; border-radius:8px; border:2px solid var(--p);">`;
        }).catch(() => alert("⚠️ ไม่สามารถประมวลผลรูปภาพนี้ได้"));
    },

    // วางรูปจากคลิปบอร์ด (เช่น คัดลอกรูปจาก Google มา) โดยไม่ต้องดาวน์โหลดเก็บในเครื่องก่อน
    pasteImageFromClipboard() {
        if(!navigator.clipboard || !navigator.clipboard.read) {
            alert("⚠️ เบราว์เซอร์นี้ไม่รองรับการวางรูปจากคลิปบอร์ด กรุณาใช้ปุ่มถ่ายรูป/เลือกไฟล์แทน");
            return;
        }
        navigator.clipboard.read().then(async items => {
            for(const item of items) {
                const imgType = item.types.find(t => t.startsWith('image/'));
                if(imgType) {
                    try {
                        const blob = await item.getType(imgType);
                        const base64 = await this.processImageToBase64(blob);
                        const imgDataInput = document.getElementById('pimg_data');
                        const preview = document.getElementById('img-preview');
                        if(imgDataInput) imgDataInput.value = base64;
                        if(preview) preview.innerHTML = `<img src="${base64}" style="height:70px; border-radius:8px; border:2px solid var(--p);"><div style="font-size:10px; color:var(--p); margin-top:4px;">✅ วางรูปจากคลิปบอร์ดสำเร็จ</div>`;
                    } catch(e) {
                        alert("⚠️ ไม่สามารถวางรูปภาพนี้ได้ กรุณาลองใหม่อีกครั้ง");
                    }
                    return;
                }
            }
            alert("⚠️ ไม่พบรูปภาพในคลิปบอร์ด กรุณาคัดลอกรูปภาพมาก่อน แล้วลองใหม่");
        }).catch(() => {
            alert("⚠️ ไม่สามารถเข้าถึงคลิปบอร์ดได้ มือถือ/เบราว์เซอร์บางรุ่นอาจไม่รองรับฟีเจอร์นี้ กรุณาใช้ปุ่มถ่ายรูปแทน");
        });
    },

                </label>
            </div>
            <div class="card"><h3>📤 สำรองข้อมูล (Backup)</h3><button class="btn btn-s" onclick="App.exportJ()">ดาวน์โหลดไฟล์สำรองข้อมูล (.json)</button></div>
            <div class="card"><h3>📥 นำเข้าข้อมูล (Import)</h3><input type="file" class="input-main" onchange="App.importJ(event)"></div>
            ${this.isAdmin() ? `
            <div class="card">
                <h3 style="margin-top:0">🌐 ซิงค์ข้อมูลออนไลน์ (Google Sheets)</h3>
                <p style="font-size:12px; color:var(--ink-s); margin-top:0;">เชื่อมกับ Google Sheets ของคุณ ข้อมูลจะอัปเดตขึ้นออนไลน์ทุกครั้งที่บันทึก ไม่ต้องโอนไฟล์ backup ทีละเครื่องอีกต่อไป</p>
                ${this.renderCloudStatus()}
                <label style="font-size:11px; font-weight:600; color:var(--ink-s); display:block; margin-bottom:4px; margin-top:10px;">Web app URL (จาก Apps Script Deploy)</label>
                <input type="text" id="cloud_url" class="input-main" placeholder="https://script.google.com/macros/s/xxxxx/exec" value="${(this.getCloudConfig()||{}).url || ''}">
                <label style="font-size:11px; font-weight:600; color:var(--ink-s); display:block; margin-bottom:4px;">รหัสลับ (SECRET_TOKEN ที่ตั้งไว้ในโค้ด Apps Script)</label>
                <div class="pwd-wrap">
                    <input type="password" id="cloud_token" class="input-main" placeholder="รหัสลับ" value="${(this.getCloudConfig()||{}).token || ''}">
                    <button type="button" class="eye-btn" onclick="App.togglePwd('cloud_token', this)">👁️</button>
                </div>
                <button class="btn btn-p" onclick="App.connectCloud()">🔗 เชื่อมต่อและซิงค์เดี๋ยวนี้</button>
                ${(this.getCloudConfig()||{}).enabled ? `<button class="btn btn-outline" style="border-color:var(--err); color:var(--err);" onclick="App.disconnectCloud()">ยกเลิกการซิงค์</button>` : ''}
            </div>
            ` : ''}
            ${this.isAdmin() ? `
            <div class="card">
                <h3 style="margin-top:0">👤 จัดการบัญชีผู้ใช้ (เฉพาะ Admin)</h3>
                <p style="font-size:12px; color:var(--ink-s); margin-top:0;">Admin จัดการได้ทั้งเพิ่ม/ลบบัญชี และกำหนดสิทธิ์ Admin หรือ User</p>
                ${(this.db.settings.accounts||[]).map(a => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #eee;">
                        <span>${a.name} <span style="font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600; ${this.isAdminRole(a.role) ? 'background:#FCEEDC;color:#946015;' : 'background:#E2E8E0;color:var(--pd);'}">${this.isAdminRole(a.role)?'Admin':'User'}</span></span>
                        <button onclick="App.deleteAccount('${a.name}')" style="border:none; background:none; color:var(--err); cursor:pointer; font-size:13px;">ลบ</button>
                    </div>
                `).join('')}
                <input type="text" id="new_acc_name" class="input-main" style="margin-top:10px;" placeholder="ชื่อบัญชีใหม่">
                <div class="pwd-wrap">
                    <input type="password" id="new_acc_pass" class="input-main" placeholder="รหัสผ่าน">
                    <button type="button" class="eye-btn" onclick="App.togglePwd('new_acc_pass', this)">👁️</button>
                </div>
                <select id="new_acc_role" class="input-main">
                    <option value="user">User (พนักงานทั่วไป)</option>
                    <option value="admin">Admin (ผู้ดูแลระบบ)</option>
                </select>
                <button class="btn btn-p" onclick="App.addAccount()">+ เพิ่มบัญชี</button>
            </div>
            ` : ''}
        `;
    },
    saveSettings() {
        const sInput = document.getElementById('sname');
        if(sInput) {
            this.db.settings.storeName = sInput.value;
            this.save().then(() => {
                alert("✅ บันทึกชื่อร้านค้าเรียบร้อยแล้ว");
                location.reload();
            });
        }
    },

    savePaperSize(size) {
        this.db.settings.paperSize = size;
        this.save();
        this.render();
    },
    exportJ() {
        const b = new Blob([JSON.stringify(this.db)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = `SanPOS_Backup_${Date.now()}.json`; a.click();
    },
    importJ(e) {
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = ev => {
            try {
                this.db = JSON.parse(ev.target.result);
                this.save().then(() => {
                    alert("✅ นำเข้าข้อมูลเรียบร้อยแล้ว");
                    location.reload();
                });
            } catch(err) {
                alert("❌ ไฟล์ไม่ถูกต้อง กรุณาเลือกไฟล์ .json ของระบบ SanPOS");
            }
        }; 
        r.readAsText(f);
    },

    // --- ระบบสิทธิ์ Admin / User ---
    // เรียก requireAdmin(fn) ก่อนทำ action ที่ต้องมีสิทธิ์ Admin เท่านั้น
    // ถ้า login อยู่แล้วและเป็น Admin จะรัน fn ทันที ถ้าเป็น User ต้องให้ Admin ยืนยันตัวตนก่อน
    requireAdmin(fn) {
        if(this.isAdmin()) { fn(); return; }
        this.openAdminOverrideModal(fn);
    },

    openAdminOverrideModal(onSuccess) {
        const admins = (this.db.settings.accounts || []).filter(a => this.isAdminRole(a.role));
        this.openM(`
            <div style="background:#FCEEDC;border:1px solid #F0D19E;border-radius:12px;padding:10px 12px;font-size:12px;color:#7A5416;margin-bottom:12px;">
                ⚠️ บัญชี "${this.state.authedUser}" เป็นพนักงานทั่วไป ไม่มีสิทธิ์แก้ไขข้อมูลนี้โดยตรง กรุณาให้ผู้ดูแลระบบ (Admin) ยืนยันตัวตนก่อน
            </div>
            <h3 style="margin-top:0">🔐 ยืนยันสิทธิ์ผู้ดูแลระบบ</h3>
            <label style="font-size:11px; font-weight:600; color:var(--ink-s); display:block; margin-bottom:4px;">บัญชี Admin</label>
            <select id="admin_ov_name" class="input-main">
                ${admins.map(a=>`<option value="${a.name}">${a.name}</option>`).join('')}
            </select>
            <div class="pwd-wrap">
                <input type="password" id="admin_ov_pass" class="input-main" placeholder="รหัสผ่าน Admin" onkeydown="if(event.key==='Enter'){ event.preventDefault(); App.confirmAdminOverride(); }">
                <button type="button" class="eye-btn" onclick="App.togglePwd('admin_ov_pass', this)">👁️</button>
            </div>
            <div id="admin_ov_err" class="hidden" style="color:var(--err); font-size:12px; margin-bottom:8px;">❌ รหัสผ่าน Admin ไม่ถูกต้อง</div>
            <button class="btn btn-p" onclick="App.confirmAdminOverride()">✅ ยืนยันและดำเนินการต่อ</button>
            <button class="btn btn-outline" onclick="App.closeM()">ยกเลิก</button>
        `);
        this._pendingAdminOverride = onSuccess;
    },

    confirmAdminOverride() {
        const name = document.getElementById('admin_ov_name').value;
        const pass = document.getElementById('admin_ov_pass').value || '';
        const acc = this.getAccount(name);
        const errEl = document.getElementById('admin_ov_err');
        if(!acc || !this.isAdminRole(acc.role) || acc.password !== pass) { errEl.classList.remove('hidden'); return; }
        errEl.classList.add('hidden');
        const cb = this._pendingAdminOverride; this._pendingAdminOverride = null;
        this.closeM();
        // เปิดสิทธิ์ Admin ชั่วคราวแค่ระหว่างเรียก callback นี้ (synchronous) เพื่อไม่ให้เช็คสิทธิ์ซ้ำแล้ววนลูป
        this._adminOverrideActive = true;
        try { if(cb) cb(); } finally { this._adminOverrideActive = false; }
    },

    logoutAccount() {
        this.state.authedUser = null;
        this.render();
    },

    // เพิ่มบัญชีจากหน้าตั้งค่า (Admin เท่านั้นที่เห็นการ์ดนี้) เลือก role ได้ทั้ง admin/user
    addAccount() {
        const name = (document.getElementById('new_acc_name').value || '').trim();
        const pass = document.getElementById('new_acc_pass').value || '';
        const role = document.getElementById('new_acc_role').value || 'user';
        if(!name || !pass) { alert("กรุณากรอกชื่อและรหัสผ่านให้ครบ"); return; }
        if(this.getAccount(name)) { alert("มีชื่อนี้ในระบบแล้ว"); return; }
        this.db.settings.accounts.push({ name, password: pass, role });
        this.save();
        this.render();
    },

    deleteAccount(name) {
        const acc = this.getAccount(name);
        if(acc && this.isAdminRole(acc.role) && (this.db.settings.accounts||[]).filter(a=>this.isAdminRole(a.role)).length <= 1) {
            alert("⚠️ ไม่สามารถลบได้ ต้องมีบัญชี Admin เหลืออยู่อย่างน้อย 1 บัญชีเสมอ");
            return;
        }
        if(!confirm(`ลบบัญชี "${name}" หรือไม่?`)) return;
        this.db.settings.accounts = this.db.settings.accounts.filter(a => a.name !== name);
        if(this.state.authedUser === name) this.state.authedUser = null;
        this.save();
        this.render();
    },

    // --- HELPERS & SCANNER ---
    openM(h) { 
        const root = document.getElementById('modal-root');
        if(root) {
            root.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) App.closeM()"><div class="modal">${h}</div></div>`; 
        }
    },
    closeM() { 
        const root = document.getElementById('modal-root');
        if(root) root.innerHTML = ""; 
    },
    setMember(id) {
        this.state.member = id ? (this.db.members || []).find(x => x.id === id) : null;
        this.recalcCartPrices();
        this.closeM();
        this.render();
    },

    recalcCartPrices() {
        const isM = this.state.member !== null;
        this.state.cart.forEach(item => {
            const p = this.db.products.find(x => x.id === item.id);
            if(!p) return;
            let suffix = '1';
            if(item.name.includes('[แพ็ค]')) suffix = '2';
            else if(item.name.includes('[ลัง]')) suffix = '3';
            const key = (isM ? 'pw' : 'pr') + suffix;
            if(typeof p[key] === 'number') item.price = p[key];
        });
        this.updateCartUI();
    },

    modalCust() {
        this.openM(`
            <h3 style="margin-top:0">เลือกลูกค้า / สมาชิก</h3>
            <div style="padding:12px; border-bottom:1px solid #eee; cursor:pointer;" onclick="App.setMember(null)">-- ลูกค้าทั่วไป --</div>
            ${(this.db.members || []).map(m=>`<div style="padding:12px; border-bottom:1px solid #eee; cursor:pointer;" onclick="App.setMember('${m.id}')">${m.name}</div>`).join('')}
        `);
    },
    
    async openScanner() {
        if (typeof Html5Qrcode === 'undefined') {
            try { await this.loadScript('https://unpkg.com/html5-qrcode'); } catch(e) {
                alert("⚠️ ไม่สามารถโหลดระบบสแกนได้ กรุณาเชื่อมต่ออินเทอร์เน็ต");
                return;
            }
        }

        this.openM(`
            <h3 style="margin-top:0">📷 สแกนบาร์โค้ด / QR Code</h3>
            <div id="reader" style="width:100%; min-height:250px;"></div>
            <button class="btn btn-p" style="margin-top:15px" onclick="App.stopScanner()">ปิดกล้อง</button>
        `);
        
        setTimeout(() => {
            try {
                this.state.scanner = new Html5Qrcode("reader");
                this.state.scanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: { width: 250, height: 150 } },
                    (txt) => {
                        const cleanTxt = txt.trim();
                        const p = this.db.products.find(x => (x.bc || '').toString().trim() === cleanTxt);
                        if(p) { 
                            this.stopScanner(); 
                            const price = this.state.member ? p.pw1 : p.pr1;
                            this.pushCart(p.id, price, 1, 'ชิ้น');
                        } else {
                            alert("ไม่พบสินค้ารหัสบาร์โค้ดนี้: " + cleanTxt);
                        }
                    }
                ).catch(() => {
                    alert("ไม่สามารถเปิดกล้องได้ โปรดตรวจสอบสิทธิ์การใช้งานกล้อง");
                    this.closeM();
                });
            } catch(e) {
                this.closeM();
            }
        }, 300);
    },

    stopScanner() { 
        if(this.state.scanner) {
            this.state.scanner.stop().then(() => { 
                this.state.scanner = null; 
                this.closeM(); 
            }).catch(() => this.closeM());
        } else {
            this.closeM();
        }
    }
};

// Start application securely
window.addEventListener('DOMContentLoaded', () => {
    App.init();
});

// แจ้งเตือนถ้าเกิด error ระหว่างใช้งาน (เช่น กดปุ่มแล้วไม่มีอะไรเกิดขึ้น) จะได้เห็นสาเหตุแทนที่จะเงียบ
window.addEventListener('error', (e) => {
    console.error('App error:', e.message, e.filename, e.lineno);
    alert("⚠️ เกิดข้อผิดพลาด: " + e.message + " (บรรทัด " + e.lineno + ")");
});

</script>
</body>
</html>
