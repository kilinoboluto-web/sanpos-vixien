#pos-root {

  --ink: #1C2320;
  --ink-soft: #5B655F;
  --green: #1F5F4A;
  --green-dark: #143C30;
  --green-soft: #E4EEE8;
  --gold: #E8A33D;
  --gold-soft: #FBEBD1;
  --brick: #C1502E;
  --brick-soft: #F8E4DD;
  --line: #DDE3D9;
  font-family: 'Sarabun', 'Noto Sans Lao', sans-serif;
  color: var(--ink);
  background: var(--paper);
  min-height: 100%;
  border-radius: 12px;
  overflow: hidden;
}
#pos-root[data-lang="lo"] { font-family: 'Noto Sans Lao', 'Sarabun', sans-serif; }
#pos-root * { box-sizing: border-box; }
#pos-root h1, #pos-root h2, #pos-root h3, #pos-root .display {

}
#pos-root .mono { font-family: 'IBM Plex Mono', monospace; }
#pos-root button { font-family: inherit; cursor: pointer; border: none; }
#pos-root input, #pos-root select { font-family: inherit; }

.pos-header {
  background: var(--green-dark);
  color: #fff;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;

}
.pos-header-top { display:flex; align-items:center; justify-content:space-between; width:100%; gap:12px; flex-wrap:wrap; }
.pos-header h1 { font-size: 20px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; }
.pos-header h1 .tag { background: var(--gold); color: var(--green-dark); font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; font-family:'Sarabun',sans-serif; }
.lang-switch { display:flex; gap:4px; background: rgba(255,255,255,0.1); padding:3px; border-radius: 8px; }
.lang-btn { padding: 5px 10px; border-radius:6px; font-size:12px; font-weight:700; color: rgba(255,255,255,0.7); background:transparent; }

.pos-tabs { display: flex; gap: 6px; background: rgba(255,255,255,0.08); padding: 4px; border-radius: 10px; overflow-x:auto; width:100%; }
.pos-tab-btn { background: transparent; color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 8px; white-space:nowrap; transition: background 0.15s, color 0.15s; }
.pos-tab-btn.active { background: var(--gold); color: var(--green-dark); }
.pos-tab-btn:not(.active):hover { background: rgba(255,255,255,0.12); color: #fff; }

.pos-body { padding: 18px 24px 28px; }

/* ---- SELL TAB ---- */
.mode-bar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.mode-toggle { display:flex; background: var(--surface); border:1.5px solid var(--line); border-radius: 10px; padding:3px; }
.mode-btn { padding: 8px 16px; border-radius: 8px; font-size:13px; font-weight:700; color: var(--ink-soft); background:transparent; }
.mode-btn.active.retail { background: var(--green); color:#fff; }
.mode-btn.active.wholesale { background: var(--gold); color: var(--green-dark); }
.customer-select { display:flex; gap:8px; align-items:center; flex:1; min-width:200px; }
.customer-select select { flex:1; padding:9px 10px; border:1.5px solid var(--line); border-radius:9px; background:var(--surface); font-size:13.5px; color:var(--ink); }
.member-badge { font-size:11px; font-weight:700; padding:4px 9px; border-radius:6px; background: var(--gold-soft); color:#8a5c14; white-space:nowrap; }

.sell-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }

.sell-toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.sell-search { flex: 1; min-width: 160px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 14px; background: var(--surface); color: var(--ink); }
.sell-search:focus { outline: none; border-color: var(--green); }

.cat-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
.cat-chip { white-space: nowrap; padding: 7px 14px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--line); color: var(--ink-soft); font-size: 13px; font-weight: 600; }

.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.product-card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 12px; text-align: left; transition: border-color 0.15s, transform 0.1s; position: relative; display: flex; flex-direction: column; gap: 6px; min-height: 108px; }
.product-card:hover { border-color: var(--green); transform: translateY(-2px); }
.product-card:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.product-card .pname { font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--ink); }
.product-card .pcat { font-size: 11px; color: var(--ink-soft); }
.product-card .pfoot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
.product-card .pprice { font-size: 15px; font-weight: 600; color: var(--green-dark); }
.product-card .pstock { font-size: 10.5px; padding: 2px 6px; border-radius: 5px; background: var(--green-soft); color: var(--green-dark); font-weight: 600; }
.product-card .pstock.low { background: var(--brick-soft); color: var(--brick); }
.empty-note { color: var(--ink-soft); font-size: 14px; padding: 30px 10px; text-align: center; }

.receipt-wrap { position: sticky; top: 10px; }
.zigzag-top, .zigzag-bottom { height: 12px; background-image: linear-gradient(-45deg, var(--surface) 6px, transparent 0), linear-gradient(45deg, var(--surface) 6px, transparent 0); background-size: 14px 20px; background-repeat: repeat-x; }
.zigzag-top { background-position: left top; }
.zigzag-bottom { background-position: left bottom; }
.receipt { background: var(--surface); padding: 4px 18px 16px; box-shadow: 0 2px 10px rgba(20,40,32,0.08); }
.receipt-head { text-align: center; padding: 10px 0 12px; border-bottom: 1px dashed var(--line); }
.receipt-head .display { font-size: 16px; font-weight: 700; color: var(--green-dark); }
.receipt-head .sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
.cart-list { padding: 10px 0; max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.cart-empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 24px 0; }
.cart-row { display: flex; align-items: center; gap: 8px; }
.cart-row .cname { flex: 1; font-size: 13px; font-weight: 500; line-height: 1.3; }
.cart-row .cline { font-size: 11px; color: var(--ink-soft); }

.cart-line-total { width: 64px; text-align: right; font-size: 13px; font-weight: 600; }
.cart-remove { background: transparent; color: var(--brick); font-size: 15px; padding: 2px 4px; }

.receipt-totals { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.receipt-totals .row { display: flex; justify-content: space-between; }
.receipt-totals .grand { font-size: 18px; font-weight: 700; color: var(--green-dark); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }
.cash-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.cash-row input { flex: 1; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 8px; font-size: 14px; text-align: right; }
.cash-row input:focus { outline: none; border-color: var(--green); }
.checkout-btn { width: 100%; margin-top: 12px; padding: 13px; background: var(--green); color: #fff; font-weight: 700; font-size: 15px; border-radius: 10px; transition: background 0.15s; }
.checkout-btn:hover:not(:disabled) { background: var(--green-dark); }
.checkout-btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }
.clear-cart-btn { width: 100%; margin-top: 8px; padding: 8px; background: transparent; color: var(--ink-soft); font-size: 12px; font-weight: 600; text-decoration: underline; }

/* ---- PANELS (products/categories/members) ---- */
.panel { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 18px 20px; }

.cat-tag button { background: var(--brick-soft); color: var(--brick); width:20px; height:20px; border-radius:50%; font-size:12px; line-height:1; display:flex; align-items:center; justify-content:center; }

/* ---- REPORTS ---- */

.stat-card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px 18px; }

.list-item .li-main { font-weight: 600; }
.list-item .li-sub { font-size: 11.5px; color: var(--ink-soft); }
.danger-zone { margin-top: 20px; text-align: right; }
.danger-link { background: transparent; color: var(--brick); font-size: 12px; text-decoration: underline; font-weight: 600; }

.modal-card { background: var(--surface); border-radius: 16px; max-width: 340px; width: 100%; padding: 24px; text-align: center; }
.modal-card .check-circle { width: 52px; height: 52px; background: var(--green-soft); color: var(--green); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 12px; }
.modal-card h3 { font-size: 17px; margin: 0 0 4px; }
.modal-card .m-total { font-size: 22px; font-weight: 700; color: var(--green-dark); margin: 10px 0 2px; }
.modal-card .m-change { font-size: 13px; color: var(--ink-soft); margin-bottom: 16px; }
.modal-actions { display:flex; flex-direction:column; gap:8px; }
.modal-close-btn { width: 100%; padding: 11px; background: var(--green); color: #fff; font-weight: 700; border-radius: 10px; font-size: 14px; }
.modal-close-btn:hover { background: var(--green-dark); }
.modal-print-btn { width: 100%; padding: 11px; background: var(--gold-soft); color: #8a5c14; font-weight: 700; border-radius: 10px; font-size: 14px; }
.modal-print-btn:hover { background: var(--gold); color:#fff; }

.loading-screen { padding: 80px 20px; text-align: center; color: var(--ink-soft); font-size: 14px; }

/* ---- Print receipt (hidden on screen) ---- */
#print-receipt { display: none; }
@media print {
  body > *:not(#print-receipt-portal) { display: none !important; }
  #print-receipt-portal { display: block !important; position: static; }
  #print-receipt { display: block !important; width: 78mm; margin: 0 auto; font-family: 'IBM Plex Mono', monospace; color: #000; }
  #print-receipt .pr-shop { text-align:center; font-weight:700; font-size:14px; margin-bottom:4px; }
  #print-receipt .pr-sub { text-align:center; font-size:10px; margin-bottom:8px; }
  #print-receipt hr { border: none; border-top: 1px dashed #000; margin: 6px 0; }
  #print-receipt .pr-row { display:flex; justify-content:space-between; font-size:11px; margin-bottom:2px; }
  #print-receipt .pr-total { font-weight:700; font-size:13px; }
}

  // Storage layer: uses the Claude artifact storage API when available (viewing inside
  // a chat), and falls back to the browser's own localStorage when the file is opened
  // directly (downloaded and double-clicked, or hosted on the shop's own device).
  // This is what makes data actually persist when opening/closing the file standalone.
  const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
  async function kvGet(key){
    if (hasCloudStorage){
      try { const r = await window.storage.get(key, false); return r && r.value ? r.value : null; }
      catch(e){ return null; }
    }
    try { return window.localStorage.getItem(key); } catch(e){ return null; }
  }
  async function kvSet(key, value){
    if (hasCloudStorage){
      try { await window.storage.set(key, value, false); return true; }
      catch(e){ console.error(e); return false; }
    }
    try { window.localStorage.setItem(key, value); return true; }
    catch(e){ console.error(e); return false; }
  }

  async function loadData(){
    try { const v = await kvGet('pos-categories-v2'); categories = v ? JSON.parse(v) : null; } catch(e){ categories = null; }
    if (!categories){ categories = seedCategories(); await saveCategories(); }

    try { const v = await kvGet('pos-products-v2'); products = v ? JSON.parse(v) : null; } catch(e){ products = null; }
    if (!products){ products = seedProducts(); await saveProducts(); }

    try { const v = await kvGet('pos-members-v2'); members = v ? JSON.parse(v) : []; } catch(e){ members = []; }
    try { const v = await kvGet('pos-sales-v2'); sales = v ? JSON.parse(v) : []; } catch(e){ sales = []; }
    try { const v = await kvGet('pos-settings-v2'); if (v){ const s=JSON.parse(v); if (LANGS.includes(s.lang)) lang = s.lang; } } catch(e){}
  }
  async function saveProducts(){ await kvSet('pos-products-v2', JSON.stringify(products)); }
  async function saveCategories(){ await kvSet('pos-categories-v2', JSON.stringify(categories)); }
  async function saveMembers(){ await kvSet('pos-members-v2', JSON.stringify(members)); }
  async function saveSales(){ await kvSet('pos-sales-v2', JSON.stringify(sales)); }
  async function saveSettings(){ await kvSet('pos-settings-v2', JSON.stringify({lang})); }

  function money(n){ return (Math.round(n*100)/100).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function todayStr(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtTime(ts){ const d = new Date(ts); return d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function priceFor(p){
    const member = !!selectedMemberId;
    if (saleMode === 'retail') return member ? p.priceRetailMember : p.priceRetailGeneral;
    return member ? p.priceWholesaleMember : p.priceWholesaleGeneral;
  }
  function cartTotal(){ return cart.reduce((s,i)=>s+i.price*i.qty,0); }

  // ---------- render ----------
  function render(){
    root.setAttribute('data-lang', lang);
    if (activeCategory === null) activeCategory = t('all');

    mount.innerHTML = `
      <div class="pos-header">
        <div class="pos-header-top">
          <h1>${esc(t('appName'))} <span class="tag">POS</span></h1>
          <div class="lang-switch">
            <button class="lang-btn ${lang==='th'?'active':''}" data-lang-btn="th">ไทย</button>
            <button class="lang-btn ${lang==='lo'?'active':''}" data-lang-btn="lo">ລາວ</button>
            <button class="lang-btn ${lang==='en'?'active':''}" data-lang-btn="en">EN</button>
          </div>
        </div>
        <div class="pos-tabs">
          <button class="pos-tab-btn ${tab==='sell'?'active':''}" data-tab="sell">${esc(t('tabSell'))}</button>
          <button class="pos-tab-btn ${tab==='products'?'active':''}" data-tab="products">${esc(t('tabProducts'))}</button>
          <button class="pos-tab-btn ${tab==='categories'?'active':''}" data-tab="categories">${esc(t('tabCategories'))}</button>
          <button class="pos-tab-btn ${tab==='members'?'active':''}" data-tab="members">${esc(t('tabMembers'))}</button>
          <button class="pos-tab-btn ${tab==='reports'?'active':''}" data-tab="reports">${esc(t('tabReports'))}</button>
        </div>
      </div>
      <div class="pos-body" id="pos-body"></div>
    `;
    const body = document.getElementById('pos-body');
    if (tab === 'sell') body.innerHTML = renderSell();
    else if (tab === 'products') body.innerHTML = renderProducts();
    else if (tab === 'categories') body.innerHTML = renderCategories();
    else if (tab === 'members') body.innerHTML = renderMembers();
    else body.innerHTML = renderReports();

    if (receiptModal) {
      const wrap = document.createElement('div');
      wrap.innerHTML = renderReceiptModal();
      mount.appendChild(wrap.firstElementChild);
    }
    attachEvents();
  }

  function renderSell(){
    const cur = t('currency');
    const cats = [t('all'), ...categories];
    let filtered = products.filter(p => (activeCategory===t('all') || p.category===activeCategory));
    if (searchQuery.trim()){
      const q = searchQuery.trim().toLowerCase();
      filtered = filtered.filter(p => p.name.toLowerCase().includes(q));
    }
    const cards = filtered.length ? filtered.map(p=>{
      const inCart = cart.find(c=>c.id===p.id);
      const remaining = p.stock - (inCart ? inCart.qty : 0);
      const low = p.stock <= 10;
      const price = priceFor(p);
      return `
        <button class="product-card" data-add="${p.id}" ${remaining<=0?'disabled':''}>
          <div class="pname">${esc(p.name)}</div>
          <div class="pcat">${esc(p.category)}</div>
          <div class="pfoot">
            <span class="pprice mono">${cur}${money(price)}</span>
            <span class="pstock ${low?'low':''}">${esc(t('stockLeft'))} ${remaining}</span>
          </div>
        </button>`;
    }).join('') : `<div class="empty-note">${esc(t('noProducts'))}</div>`;

    const cartRows = cart.length ? cart.map(c=>`
      <div class="cart-row" data-cart-id="${c.id}">
        <div style="flex:1">
          <div class="cname">${esc(c.name)}</div>
          <div class="cline mono">${cur}${money(c.price)} x ${c.qty}</div>
        </div>
        <div class="qty-ctrl">
          <button class="qty-btn" data-qty="-1">−</button>
          <span class="qty-num">${c.qty}</span>
          <button class="qty-btn" data-qty="1">+</button>
        </div>
        <div class="cart-line-total mono">${cur}${money(c.price*c.qty)}</div>
        <button class="cart-remove" data-remove="1">✕</button>
      </div>
    `).join('') : `<div class="cart-empty">${esc(t('emptyCart'))}</div>`;

    const total = cartTotal();
    const cash = parseFloat(cashInput);
    const validCash = !isNaN(cash) && cash >= total && total > 0;
    const change = validCash ? cash - total : 0;
    const memberOptions = members.map(m=>`<option value="${m.id}" ${selectedMemberId===m.id?'selected':''}>${esc(m.name)}${m.phone?(' · '+esc(m.phone)):''}</option>`).join('');

    return `
      <div class="mode-bar">
        <div class="mode-toggle">
          <button class="mode-btn retail ${saleMode==='retail'?'active':''}" data-mode="retail">${esc(t('retail'))}</button>
          <button class="mode-btn wholesale ${saleMode==='wholesale'?'active':''}" data-mode="wholesale">${esc(t('wholesale'))}</button>
        </div>
        <div class="customer-select">
          <select id="member-select">
            <option value="">${esc(t('walkIn'))}</option>
            ${memberOptions}
          </select>
          ${selectedMemberId ? `<span class="member-badge">${esc(t('memberBadge'))}</span>` : ''}
        </div>
      </div>
      <div class="sell-grid">
        <div>
          <div class="sell-toolbar">
            <input type="text" class="sell-search" id="search-input" placeholder="${esc(t('search'))}" value="${esc(searchQuery)}" />
          </div>
          <div class="cat-scroll">
            ${cats.map(c=>`<button class="cat-chip ${c===activeCategory?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
          </div>
          <div class="product-grid">${cards}</div>
        </div>
        <div class="receipt-wrap">
          <div class="zigzag-top"></div>
          <div class="receipt">
            <div class="receipt-head">
              <div class="display">${esc(t('receiptTitle'))}</div>
              <div class="sub">${esc(t(saleMode))} · ${selectedMemberId ? esc(t('memberBadge')) : esc(t('walkIn'))}</div>
            </div>
            <div class="cart-list">${cartRows}</div>
            <div class="receipt-totals">
              <div class="row"><span>${esc(t('items'))}</span><span class="mono">${cart.reduce((s,i)=>s+i.qty,0)} ${esc(t('pieces'))}</span></div>
              <div class="row grand"><span>${esc(t('grandTotal'))}</span><span class="mono">${cur}${money(total)}</span></div>
              <div class="cash-row">
                <label style="font-size:12px;color:var(--ink-soft);white-space:nowrap;">${esc(t('cashReceived'))}</label>
                <input type="number" id="cash-input" inputmode="decimal" placeholder="0.00" value="${esc(cashInput)}" />
              </div>
              <div class="row" style="font-size:12px;color:var(--ink-soft);">
                <span>${esc(t('change'))}</span><span class="mono">${validCash ? cur+money(change) : '—'}</span>
              </div>
            </div>
            <button class="checkout-btn" id="checkout-btn" ${(!validCash || cart.length===0)?'disabled':''}>${esc(t('checkout'))}</button>
            ${cart.length ? `<button class="clear-cart-btn" id="clear-cart-btn">${esc(t('clearCart'))}</button>` : ''}
          </div>
          <div class="zigzag-bottom"></div>
        </div>
      </div>
    `;
  }

    const m = receiptModal; const cur = t('currency');

      const low = p.stock<=10;
      return `
        <tr>
          <td>${esc(p.name)}</td>

            <div class="field"><label>${esc(t('priceRetailMember'))}</label><input type="number" step="0.01" min="0" name="priceRetailMember" required value="${editing?editing.priceRetailMember:''}" /></div>
            <div class="field"><label>${esc(t('priceWholesaleGeneral'))}</label><input type="number" step="0.01" min="0" name="priceWholesaleGeneral" required value="${editing?editing.priceWholesaleGeneral:''}" /></div>

          </div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <button type="submit" class="form-submit">${editing ? esc(t('save')) : esc(t('add'))}</button>
            ${editing ? `<button type="button" class="icon-btn" id="cancel-edit-btn" style="height:40px;">${esc(t('cancel'))}</button>` : ''}
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>${esc(t('productListTitle'))} (${products.length})</h2>
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead><tr><th>${esc(t('productName'))}</th><th>${esc(t('category'))}</th><th>${esc(t('retail'))}/${esc(t('wholesale'))}</th><th>${esc(t('stock'))}</th><th></th></tr></thead>
            <tbody>${rows || `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);padding:20px;">${esc(t('noProducts'))}</td></tr>`}</tbody>

  function renderCategories(){
    const usage = {};
    products.forEach(p=>{ usage[p.category] = (usage[p.category]||0)+1; });
    return `
      <div class="panel">
        <h2>${esc(t('addCategory'))}</h2>
        <form id="category-form" style="display:flex;gap:8px;">
          <div class="field" style="flex:1;"><label>${esc(t('categoryName'))}</label><input type="text" name="category" required /></div>
          <button type="submit" class="form-submit">${esc(t('add'))}</button>

      </div>
      <div class="panel">
        <h2>${esc(t('categoryListTitle'))} (${categories.length})</h2>

          `).join('')}
        </div>
      </div>
    `;
  }

  function renderMembers(){
    const editing = memberFormEdit ? members.find(m=>m.id===memberFormEdit) : null;
    const rows = members.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(m=>`
      <tr>
        <td>${esc(m.name)}</td>
        <td class="mono">${esc(m.phone||'—')}</td>
        <td><div class="row-actions">
          <button class="icon-btn" data-edit-member="${m.id}">${esc(t('edit'))}</button>
          <button class="icon-btn danger" data-delete-member="${m.id}">${esc(t('del'))}</button>
        </div></td>
      </tr>`).join('');
    return `
      <div class="panel">
        <h2>${editing ? esc(t('edit'))+' '+esc(t('tabMembers')) : esc(t('addMember'))}</h2>
        <form id="member-form">
          <div class="form-grid">
            <div class="field"><label>${esc(t('memberName'))}</label><input type="text" name="name" required value="${editing?esc(editing.name):''}" /></div>
            <div class="field"><label>${esc(t('memberPhone'))}</label><input type="text" name="phone" value="${editing?esc(editing.phone||''):''}" /></div>
            <button type="submit" class="form-submit">${editing ? esc(t('save')) : esc(t('add'))}</button>
            ${editing ? `<button type="button" class="icon-btn" id="cancel-edit-member-btn" style="height:40px;">${esc(t('cancel'))}</button>` : ''}
          </div>
        </form>
      </div>
      <div class="panel">
        <h2>${esc(t('memberListTitle'))} (${members.length})</h2>
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead><tr><th>${esc(t('memberName'))}</th><th>${esc(t('memberPhone'))}</th><th></th></tr></thead>
            <tbody>${rows || `<tr><td colspan="3" style="text-align:center;color:var(--ink-soft);padding:20px;">${esc(t('noMembers'))}</td></tr>`}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  function renderReports(){
    const cur = t('currency');
    const today = todayStr();
    const todaysList = sales.filter(s => s.dateStr === today);
    const todayRevenue = todaysList.reduce((s,x)=>s+x.total,0);
    const lowStock = products.filter(p=>p.stock<=10).sort((a,b)=>a.stock-b.stock);
    const salesByProduct = {};
    sales.forEach(s => s.items.forEach(it => { salesByProduct[it.name] = (salesByProduct[it.name]||0) + it.qty; }));
    const topProducts = Object.entries(salesByProduct).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const recent = sales.slice().reverse().slice(0,10);

    return `
      <div class="stat-row">
        <div class="stat-card"><div class="slabel">${esc(t('todaySales'))}</div><div class="sval mono">${cur}${money(todayRevenue)}</div></div>
        <div class="stat-card gold"><div class="slabel">${esc(t('todayBills'))}</div><div class="sval mono">${todaysList.length}</div></div>
        <div class="stat-card brick"><div class="slabel">${esc(t('lowStockCount'))}</div><div class="sval mono">${lowStock.length}</div></div>
      </div>
      <div class="panel">
        <h2>${esc(t('topProducts'))}</h2>
        ${topProducts.length ? topProducts.map(([name,qty])=>`<div class="list-item"><span class="li-main">${esc(name)}</span><span class="mono">${qty} ${esc(t('pieces'))}</span></div>`).join('') : `<div class="cart-empty">${esc(t('noSalesData'))}</div>`}
      </div>
      <div class="panel">
        <h2>${esc(t('lowStockList'))}</h2>
        ${lowStock.length ? lowStock.map(p=>`<div class="list-item"><span class="li-main">${esc(p.name)}</span><span class="mono" style="color:var(--brick);">${p.stock} ${esc(p.unit||'')}</span></div>`).join('') : `<div class="cart-empty">${esc(t('okStock'))}</div>`}
      </div>
      <div class="panel">
        <h2>${esc(t('recentSales'))}</h2>
        ${recent.length ? recent.map(s=>`
          <div class="list-item">
            <div><div class="li-main">${s.items.reduce((a,i)=>a+i.qty,0)} ${esc(t('pieces'))} · ${esc(t(s.mode||'retail'))}</div><div class="li-sub">${fmtTime(s.ts)}</div></div>
            <span class="mono">${cur}${money(s.total)}</span>
          </div>`).join('') : `<div class="cart-empty">${esc(t('noSales'))}</div>`}
        <div class="danger-zone"><button class="danger-link" id="reset-data-btn">${esc(t('resetAll'))}</button></div>
      </div>
    `;
  }

  // ---------- events ----------
  function attachEvents(){
    mount.querySelectorAll('[data-lang-btn]').forEach(el=>{
      el.addEventListener('click', ()=>{ lang = el.dataset.langBtn; activeCategory = null; saveSettings(); render(); });
    });
    mount.querySelectorAll('[data-tab]').forEach(el=>{
      el.addEventListener('click', ()=>{ tab = el.dataset.tab; productFormEdit=null; memberFormEdit=null; render(); });
    });

    if (tab === 'sell'){
      mount.querySelectorAll('[data-mode]').forEach(el=>{
        el.addEventListener('click', ()=>{ saleMode = el.dataset.mode; render(); });
      });
      const memberSel = document.getElementById('member-select');
      if (memberSel) memberSel.addEventListener('change', e=>{ selectedMemberId = e.target.value; render(); });

      const searchEl = document.getElementById('search-input');
      if (searchEl) searchEl.addEventListener('input', e=>{ searchQuery = e.target.value; render(); preserveFocus('search-input'); });

      mount.querySelectorAll('[data-cat]').forEach(el=>{
        el.addEventListener('click', ()=>{ activeCategory = el.dataset.cat; render(); });
      });
      mount.querySelectorAll('[data-add]').forEach(el=>{
        el.addEventListener('click', ()=>{
          const pid = el.dataset.add;
          const prod = products.find(p=>p.id===pid);
          if (!prod) return;
          const existing = cart.find(c=>c.id===pid);
          const currentQty = existing ? existing.qty : 0;
          if (currentQty >= prod.stock) return;
          const price = priceFor(prod);
          if (existing) { existing.qty++; existing.price = price; }
          else cart.push({id: prod.id, name: prod.name, price, qty: 1});
          render();
        });
      });
      mount.querySelectorAll('[data-cart-id]').forEach(rowEl=>{
        const cid = rowEl.dataset.cartId;
        const item = cart.find(c=>c.id===cid);
        const prod = products.find(p=>p.id===cid);
        rowEl.querySelectorAll('[data-qty]').forEach(btn=>{
          btn.addEventListener('click', ()=>{
            const delta = parseInt(btn.dataset.qty,10);
            if (delta>0 && prod && item.qty >= prod.stock) return;
            item.qty += delta;
            if (item.qty<=0) cart = cart.filter(c=>c.id!==cid);
            render();
          });
        });
        const rmBtn = rowEl.querySelector('[data-remove]');
        if (rmBtn) rmBtn.addEventListener('click', ()=>{ cart = cart.filter(c=>c.id!==cid); render(); });
      });
      const cashEl = document.getElementById('cash-input');
      if (cashEl) cashEl.addEventListener('input', e=>{ cashInput = e.target.value; render(); preserveFocus('cash-input'); });
      const clearBtn = document.getElementById('clear-cart-btn');
      if (clearBtn) clearBtn.addEventListener('click', ()=>{ cart=[]; cashInput=''; render(); });
      const checkoutBtn = document.getElementById('checkout-btn');
      if (checkoutBtn) checkoutBtn.addEventListener('click', doCheckout);
      const closeReceiptBtn = document.getElementById('close-receipt-btn');
      if (closeReceiptBtn) closeReceiptBtn.addEventListener('click', ()=>{ receiptModal = null; render(); });
      const printBtn = document.getElementById('print-receipt-btn');
      if (printBtn) printBtn.addEventListener('click', doPrint);
    }

    if (tab === 'products'){
      const form = document.getElementById('product-form');
      if (form) form.addEventListener('submit', onProductFormSubmit);
      const cancelBtn = document.getElementById('cancel-edit-btn');
      if (cancelBtn) cancelBtn.addEventListener('click', ()=>{ productFormEdit=null; render(); });
      mount.querySelectorAll('[data-edit]').forEach(el=>{
        el.addEventListener('click', ()=>{ productFormEdit = el.dataset.edit; render(); });
      });
      mount.querySelectorAll('[data-delete]').forEach(el=>{
        el.addEventListener('click', ()=>{
          const pid = el.dataset.delete;
          const p = products.find(x=>x.id===pid);
          if (p && confirm(`${p.name} — ${t('confirmDeleteProduct')}`)){
            products = products.filter(x=>x.id!==pid);
            cart = cart.filter(c=>c.id!==pid);
            saveProducts();
            render();
          }
        });
      });
    }

    if (tab === 'categories'){
      const form = document.getElementById('category-form');
      if (form) form.addEventListener('submit', e=>{
        e.preventDefault();
        const fd = new FormData(e.target);
        const name = (fd.get('category')||'').toString().trim();
        if (!name || categories.includes(name)) return;
        categories.push(name);
        saveCategories();
        render();
      });
      mount.querySelectorAll('[data-del-cat]').forEach(el=>{
        el.addEventListener('click', ()=>{
          const cname = el.dataset.delCat;
          const inUse = products.some(p=>p.category===cname);
          if (inUse){ alert(t('del')+': '+cname+' — '+(lang==='en'?'still used by products':(lang==='lo'?'ຍັງຖືກໃຊ້ໂດຍສິນຄ້າ':'ยังมีสินค้าใช้หมวดหมู่นี้อยู่'))); return; }
          if (confirm(`${cname} — ${t('confirmDeleteProduct')}`)){
            categories = categories.filter(c=>c!==cname);
            saveCategories();
            render();
          }
        });
      });
    }

    if (tab === 'members'){
      const form = document.getElementById('member-form');
      if (form) form.addEventListener('submit', e=>{
        e.preventDefault();
        const fd = new FormData(e.target);
        const name = (fd.get('name')||'').toString().trim();
        const phone = (fd.get('phone')||'').toString().trim();
        if (!name) return;
        if (memberFormEdit){
          const m = members.find(x=>x.id===memberFormEdit);
          if (m){ m.name=name; m.phone=phone; }
          memberFormEdit = null;
        } else {
          members.push({id: uid('m'), name, phone});
        }
        saveMembers();
        render();
      });
      const cancelBtn = document.getElementById('cancel-edit-member-btn');
      if (cancelBtn) cancelBtn.addEventListener('click', ()=>{ memberFormEdit=null; render(); });
      mount.querySelectorAll('[data-edit-member]').forEach(el=>{
        el.addEventListener('click', ()=>{ memberFormEdit = el.dataset.editMember; render(); });
      });
      mount.querySelectorAll('[data-delete-member]').forEach(el=>{
        el.addEventListener('click', ()=>{
          const mid = el.dataset.deleteMember;
          const m = members.find(x=>x.id===mid);
          if (m && confirm(`${m.name} — ${t('confirmDeleteProduct')}`)){
            members = members.filter(x=>x.id!==mid);
            if (selectedMemberId===mid) selectedMemberId='';
            saveMembers();
            render();
          }
        });
      });
    }

    if (tab === 'reports'){
      const resetBtn = document.getElementById('reset-data-btn');
      if (resetBtn) resetBtn.addEventListener('click', async ()=>{
        if (confirm(t('confirmReset'))){
          categories = seedCategories();
          products = seedProducts();
          members = [];
          sales = [];
          cart = [];
          selectedMemberId = '';
          await saveCategories(); await saveProducts(); await saveMembers(); await saveSales();
          render();
        }
      });
    }
  }

  function preserveFocus(id){
    const el = document.getElementById(id);
    if (el){ el.focus(); const v=el.value; el.value=''; el.value=v; }
  }

  async function doCheckout(){
    const total = cartTotal();
    const cash = parseFloat(cashInput);
    if (isNaN(cash) || cash < total || cart.length===0) return;
    const change = cash - total;
    const ts = new Date().toISOString();
    const sale = {
      id: uid('s'), ts, dateStr: todayStr(), mode: saleMode,
      memberId: selectedMemberId || null,
      items: cart.map(c=>({id:c.id,name:c.name,price:c.price,qty:c.qty})),
      total, cash, change
    };
    cart.forEach(c=>{ const p = products.find(x=>x.id===c.id); if (p) p.stock = Math.max(0, p.stock - c.qty); });
    sales.push(sale);
    await saveProducts();
    await saveSales();
    receiptModal = { ts, total, cash, change, items: sale.items };
    cart = [];
    cashInput = '';
    render();
  }

  function doPrint(){
    const m = receiptModal;
    if (!m) return;
    const cur = t('currency');
    const memberName = selectedMemberId ? (members.find(x=>x.id===selectedMemberId)||{}).name : '';
    const lines = m.items.map(i=>`
      <div class="pr-row"><span>${esc(i.name)} x${i.qty}</span><span>${cur}${money(i.price*i.qty)}</span></div>
    `).join('');
    const html = `
      <div class="pr-shop">${esc(t('appName'))}</div>
      <div class="pr-sub">${fmtTime(m.ts)}${memberName ? ' · '+esc(memberName) : ''}</div>
      <hr/>
      ${lines}
      <hr/>
      <div class="pr-row pr-total"><span>${esc(t('grandTotal'))}</span><span>${cur}${money(m.total)}</span></div>
      <div class="pr-row"><span>${esc(t('cashReceived'))}</span><span>${money(m.cash)}</span></div>
      <div class="pr-row"><span>${esc(t('change'))}</span><span>${cur}${money(m.change)}</span></div>
      <hr/>
      <div class="pr-sub">${esc(t('thankYou'))}</div>
    `;
    document.getElementById('print-receipt').innerHTML = html;
    window.print();
  }

  function onProductFormSubmit(e){
    e.preventDefault();
    const fd = new FormData(e.target);
    const name = (fd.get('name')||'').toString().trim();
    const category = (fd.get('category')||'').toString().trim();
    const unit = (fd.get('unit')||'').toString().trim();
    const stock = parseInt(fd.get('stock'),10);
    const priceRetailGeneral = parseFloat(fd.get('priceRetailGeneral'));
    const priceRetailMember = parseFloat(fd.get('priceRetailMember'));
    const priceWholesaleGeneral = parseFloat(fd.get('priceWholesaleGeneral'));
    const priceWholesaleMember = parseFloat(fd.get('priceWholesaleMember'));
    if (!name || !category || isNaN(stock) || [priceRetailGeneral,priceRetailMember,priceWholesaleGeneral,priceWholesaleMember].some(isNaN)) return;

    if (productFormEdit){
      const p = products.find(x=>x.id===productFormEdit);
      if (p){ Object.assign(p, {name,category,unit,stock,priceRetailGeneral,priceRetailMember,priceWholesaleGeneral,priceWholesaleMember}); }
      productFormEdit = null;
    } else {
      products.push({id: uid('p'), name, category, unit, stock, priceRetailGeneral, priceRetailMember, priceWholesaleGeneral, priceWholesaleMember});
    }
    saveProducts();
    render();
  }

  (async function init(){
    await loadData();
    render();
  })();
})();
</script>
